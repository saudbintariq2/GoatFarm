# Local development database only — do not use for production.
services:
  postgres:
    image: postgres:16-alpine
    container_name: goatfarm-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: GoatFarmDb
    ports:
      - "5432:5432"
    volumes:
      - goatfarm_pg_data:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d GoatFarmDb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  goatfarm_pg_data:
